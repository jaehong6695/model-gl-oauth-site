<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MODEL-G/L Kakao 연결 시작</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:720px;margin:48px auto;padding:0 20px;line-height:1.6}
.card{border:1px solid #ddd;border-radius:14px;padding:24px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bbb;border-radius:8px}
button{margin-top:12px;padding:11px 16px;border:0;border-radius:8px;cursor:pointer}.small{font-size:14px;color:#666}
</style></head>
<body><div class="card">
<h1>MODEL-G/L Kakao 연결 시작</h1>
<p>카카오 Developers 앱의 REST API 키를 입력하면 이 브라우저에서만 인가 URL을 만들어 카카오로 이동합니다.</p>
<input id="key" type="password" autocomplete="off" placeholder="REST API 키">
<button id="go">카카오 동의 화면 열기</button>
<p class="small">입력값은 이 페이지의 서버나 GitHub로 전송·저장하지 않습니다. 카카오 인증 서버로 이동할 때 client_id로만 사용됩니다.</p>
</div>
<script>
document.getElementById('go').onclick=()=>{
 const key=document.getElementById('key').value.trim();
 if(!key){alert('REST API 키를 입력하세요.');return;}
 const state=[...crypto.getRandomValues(new Uint8Array(18))].map(x=>x.toString(16).padStart(2,'0')).join('');
 sessionStorage.setItem('modelgl_kakao_oauth_state',state);
 const redirect='https://modelgl.is-a-good.dev/kakao-callback.html';
 const u=new URL('https://kauth.kakao.com/oauth/authorize');
 u.searchParams.set('client_id',key);
 u.searchParams.set('redirect_uri',redirect);
 u.searchParams.set('response_type','code');
 u.searchParams.set('scope','talk_message');
 u.searchParams.set('state',state);
 location.href=u.toString();
};
</script></body></html>
